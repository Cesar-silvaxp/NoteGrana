apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor =
    'io.github.react-native-community:jsc-android:2026004.+'

def notegranaUploadStoreFile =
    project.findProperty(
        "NOTEGRANA_UPLOAD_STORE_FILE"
    )

def notegranaUploadKeyAlias =
    project.findProperty(
        "NOTEGRANA_UPLOAD_KEY_ALIAS"
    )

def notegranaUploadStorePassword =
    project.findProperty(
        "NOTEGRANA_UPLOAD_STORE_PASSWORD"
    )

def notegranaUploadKeyPassword =
    project.findProperty(
        "NOTEGRANA_UPLOAD_KEY_PASSWORD"
    )

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.notegrana"

    defaultConfig {
        applicationId "com.notegrana"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (
                notegranaUploadStoreFile != null &&
                notegranaUploadKeyAlias != null &&
                notegranaUploadStorePassword != null &&
                notegranaUploadKeyPassword != null
            ) {
                storeFile file(
                    notegranaUploadStoreFile
                )

                storePassword =
                    notegranaUploadStorePassword

                keyAlias =
                    notegranaUploadKeyAlias

                keyPassword =
                    notegranaUploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android.txt"
                ),
                "proguard-rules.pro"
            )
        }
    }
}

dependencies {
    implementation(
        "com.facebook.react:react-android"
    )

    if (hermesEnabled.toBoolean()) {
        implementation(
            "com.facebook.react:hermes-android"
        )
    } else {
        implementation jscFlavor
    }
}